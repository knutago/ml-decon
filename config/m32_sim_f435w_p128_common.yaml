# M32 v2 simulation, F435W -- SHARED two-band asinh map.
#
# Identical to m32_sim_f435w_p128.yaml except that the asinh knee AND span are
# pinned, to the same values as m32_sim_f555w_p128_common.yaml.
#
# WHY. beta is normally fit per band, and on a sparse catalogue render it falls
# back to the median non-zero pixel -- which tracks how bright THAT BAND's stars
# are: 247.3 in F435W against 945.5 in F555W. The span follows beta. So the
# per-band map divides out the colour. Measured on these two datasets
# (common_norm_plan.py), the same stars differ by
#
#     3.86x in flux   ->   0.87x in z
#
# at the median: a four-fold colour arrives at the network as nothing, slightly
# inverted. Colour is the only thing a CMD measures, so neither single-band
# prior can carry it, and a cross-band application is a 0.65x rescale that puts
# F435W's median pixel BELOW the p1 of anything the F555W prior ever saw
# (0.0944 against 0.1052) -- which is the measured cause of that arm
# under-counting sources 58 to the truth's 97.
#
# THE PINNED VALUES, and how they were chosen (common_norm_fit.py):
#
#   ideal_asinh_beta 300  -- beta is the flux where the map stops being linear,
#     so on a sparse channel it belongs at the faint end. Anchored on the
#     detection limit: the 3-sigma cut sits at the 88th percentile of the
#     rendered population, i.e. ideal flux 1864 in the FAINTER band, and 300 is
#     the nearest value that also keeps both bands' target std at the level that
#     trains today. Admissible range is 40..300; larger drops the F435W target
#     below 0.045 std, where "predict blank" starts to win (CLAUDE.md 3).
#   ideal_asinh_hi_s 8.0077 = arcsinh(max/beta) over BOTH bands, so the brighter
#     band's peak still lands at z <= 1. Pinning it from F435W alone would push
#     F555W past the sinh's explosive region.
#   ideal_asinh_lo_s 0 -- both renders sit on exact zero.
#   observed_asinh_beta 68.29 = geometric mean of the two sky sigmas (46.6,
#     100.1); lo_s/hi_s over both bands' amplitude above their own sky.
#
# THE MEDIAN IS DELIBERATELY NOT PINNED. It is the sky, and it genuinely differs
# (207 vs 386 counts). Left per band, z depends on (x - sky), so a source of a
# given amplitude over its own sky maps to the same z in both -- which is the
# invariance photometry needs. Pinning a common median would instead encode the
# sky difference as if it were colour.
#
# THIS IS ONLY SAFE WITH A JOINT RETRAIN. An existing checkpoint applied to data
# under this map reproduces the old bug with the sign flipped. Train one prior
# on both bands' patches under these constants.
#
# NOT FIXED BY THIS. The F435W arm's OVER-counting (123 sources, conc 0.524) is
# in-distribution and has a different cause: 87.7% of its rendered targets sit
# below 3 sigma in its own conditioning, so fitting them requires inventing
# them. See the sky-sigma conditioning and detectability-weighting steps.
#
# RESIDUAL, worth knowing: fit_photometry is false in both bands, so the network
# absorbs each band's gain (0.916 in F435W, ~0.97 in F555W). The per-band beta
# used to hide that; under a common map it surfaces as a real ~0.06 mag colour
# offset. Small against the 0.35 colour scatter, and correctable either by
# setting fit_photometry true or by carrying the ratio through the scorer.
seed: 0
data:
  observed_fits: data/m32_sim/sim_f435w_conv.fits
  ideal_fits: data/m32_sim/sim_f435w_truth.fits
  out_dir: data/m32_sim_f435w_p128_common
  patch_size: 128
  stride: 24
  observed_normalize: asinh
  ideal_normalize: asinh
  asinh_softening: 1.0
  observed_asinh_beta: 68.287974
  observed_asinh_lo_s: -2.615495
  observed_asinh_hi_s: 7.654147
  ideal_asinh_beta: 150.000000
  ideal_asinh_lo_s: 0.000000
  ideal_asinh_hi_s: 10.376988
  split_block_size: 512
  val_fraction: 0.1
  fit_photometry: false
  crop: null
