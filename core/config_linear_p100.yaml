# Linear-domain dataset, anchor at the 100th percentile (true min-max).
#
# At anchor_percentile 100.0 the normalization is exactly the original
# LinearNorm.fit -- min/max over TRAIN pixels, no clipping, exactly invertible.
# The asinh map is still fitted (loss_softening = the old asinh_softening) and
# emitted as `ideal_loss_stretch`, but only as the training loss weighting.
#
# Grid parameters match data/m31bK50/resolved_config.yaml so this dataset is
# directly comparable to the asinh control: same corners, same train/val split.

seed: 0
data:
  observed_fits: /home/alex/noir_ml/global/ml-decon/data/m31bK50_trim.fits
  ideal_fits: /home/alex/noir_ml/global/ml-decon/data/m31bK50.fits
  out_dir: /home/alex/noir_ml/global/ml-decon/data/m31bK50_linear_p100
  patch_size: 64
  stride: 32
  anchor_percentile: 100.0
  loss_softening: 1.0
  split_block_size: 512
  val_fraction: 0.1
